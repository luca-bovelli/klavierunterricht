<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Klavierunterricht, design options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
<link rel="stylesheet" href="review/review.css">
</head>
<body>
<header class="top">
  <h1>Design options</h1>
  <p>Rate what is there now and what it could become. Text is optional. Everything is kept in this browser until you send it.</p>
  <nav id="rounds" aria-label="Rounds"></nav>
</header>
<main id="list"></main>
<footer class="bar" id="bar">
  <p id="count" aria-live="polite"></p>
  <div class="bar-buttons">
    <button type="button" class="quiet" id="copy">Copy as text</button>
    <button type="button" class="main" id="send">Send feedback</button>
  </div>
</footer>
<dialog id="zoom" aria-label="Large picture"><button type="button" class="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="zoom-scroll"><img alt=""></div></dialog>
<script src="review/designs.js"></script>
<script src="review/review.js"></script>
</body>
</html>
